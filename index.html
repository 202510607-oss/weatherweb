<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Planner - 당신의 완벽한 하루</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div class="bg-blur"></div>
        
        <aside class="sidebar">
            <div class="logo">
                <i data-lucide="layers" class="logo-icon"></i>
                <h1>Focus</h1>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="today">
                    <i data-lucide="sun"></i>
                    <span>오늘 할 일</span>
                </button>
                <button class="nav-item" data-tab="important">
                    <i data-lucide="star"></i>
                    <span>중요</span>
                </button>
                <button class="nav-item" data-tab="completed">
                    <i data-lucide="check-circle"></i>
                    <span>완료됨</span>
                </button>
            </nav>
            <div class="stats-card">
                <p>오늘의 성취</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-bar"></div>
                </div>
                <span id="progress-text">0% 완료</span>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="date-info">
                    <h2 id="current-tab-title">오늘 할 일</h2>
                    <p id="current-date">2024년 5월 28일 목요일</p>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="icon-btn">
                        <i data-lucide="moon"></i>
                    </button>
                </div>
            </header>

            <div class="input-section card">
                <div class="input-wrapper">
                    <i data-lucide="plus" class="plus-icon"></i>
                    <input type="text" id="todo-input" placeholder="새로운 할 일을 입력하세요..." autocomplete="off">
                </div>
                <div class="input-actions">
                    <select id="priority-select">
                        <option value="low">낮음</option>
                        <option value="medium" selected>보통</option>
                        <option value="high">긴급</option>
                    </select>
                    <button id="add-btn">추가하기</button>
                </div>
            </div>

            <div class="todo-section">
                <ul id="todo-list" class="todo-list">
                    <!-- JS에서 렌더링됨 -->
                    <div class="empty-state">
                        <i data-lucide="clipboard-list"></i>
                        <p>할 일이 없습니다. 새로운 하루를 시작해 보세요!</p>
                    </div>
                </ul>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
